<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/arcade/64/firework.png">
<!-- ... existing code ... -->
    <style>
        @import url('https://fonts.googleapis.com/css?family=Sacramento');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #212121;
            font-family: 'Sacramento', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Container centered without huge empty space above */
        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .container .title {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            color: #ffe45e;
            text-align: center;
            animation: move-up 1s ease-out;
            text-shadow: #ffe45e 0 0 30px, #e5c654 1px 0 10px;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .fireworks {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
            text-align: center;
        }

        /* Cute Diya Design kept exact */
        .fireworks li {
            display: inline-block;
            margin: 15px;
            height: 50px;
            width: 50px;
            border-radius: 500px;
            position: relative;
            background-color: #8D6E63;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .fireworks li::before {
            content: "";
            position: absolute;
            height: 100%;
            background-color: #212121;
            width: 100%;
            border-radius: 500px;
            top: -40%;
            left: -30%;
        }

        .fireworks li::after {
            content: "";
            position: absolute;
            height: 100%;
            background-color: #212121;
            width: 100%;
            border-radius: 500px;
            top: -40%;
            right: -30%;
        }

        .fireworks li span {
            display: inline-block;
            height: 20px;
            width: 20px;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            z-index: 1;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 50px;
            transform: rotate(45deg);
            animation: fire 0.3s ease infinite;
        }

        .fireworks li:nth-child(1) span { animation-delay: 0.5s; }
        .fireworks li:nth-child(2) span { animation-delay: 1s; }
        .fireworks li:nth-child(3) span { animation-delay: 1.5s; }
        .fireworks li:nth-child(4) span { animation-delay: 2s; }
        .fireworks li:nth-child(5) span { animation-delay: 2.5s; }
        .fireworks li:nth-child(6) span { animation-delay: 3s; }

        @keyframes fire {
            0%, 100% {
                transform: rotate(55deg);
                width: 20px;
                background: linear-gradient(90deg, orange, orangered);
            }
            50% {
                transform: rotate(35deg);
                width: 18px;
                background: linear-gradient(90deg, orangered, orange);
            }
        }

        /* Clean CSS Fireworks Explosions around the box */
        .sparkler {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: burst 4s ease-out infinite;
        }

        .c1 {
            width: 120px;
            height: 120px;
            border: 2px dashed rgba(255, 225, 200, 0.9);
            top: -20px;
            left: -30px;
            animation-delay: 0.5s;
        }

        .c2 {
            width: 160px;
            height: 160px;
            border: 3px dotted rgba(255, 205, 100, 0.9);
            top: 10px;
            right: -40px;
            animation-delay: 1.8s;
        }

        .c3 {
            width: 100px;
            height: 100px;
            border: 2px dashed rgba(255, 150, 50, 0.9);
            bottom: -10px;
            left: 20px;
            animation-delay: 2.9s;
        }

        .c4 {
            width: 140px;
            height: 140px;
            border: 2px dotted rgba(255, 235, 120, 0.9);
            bottom: -20px;
            right: 10px;
            animation-delay: 3.5s;
        }

        @keyframes move-up {
            0% { transform: translateY(80px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes burst {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        /* Canvas background overlay for falling confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Confetti Particle Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <!-- Fireworks Burst Elements -->
        <div class="sparkler c1"></div>
        <div class="sparkler c2"></div>
        <div class="sparkler c3"></div>
        <div class="sparkler c4"></div>

        <!-- Main Title -->
        <div class="title">Happy Diwali</div>
        
        <!-- Cute Diyas -->
        <ul class="fireworks">
            <li><span></span></li>
            <li><span></span></li>
            <li><span></span></li>
            <li><span></span></li>
            <li><span></span></li>
            <li><span></span></li>
        </ul>
    </div>

    <!-- Festive Confetti Animation Script -->
    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Festive Diwali Colors (Gold, Crimson, Magenta, Orange, Warm White)
        const colors = ['#ffe45e', '#ff4d6d', '#ff9f1c', '#ff007f', '#ffffff', '#ffd700'];

        class ConfettiParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 8 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 2 + 1.5;
                this.speedX = Math.random() * 1.5 - 0.75;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 4 - 2;
                this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;

                if (this.shape === 'rect') {
                    ctx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        const confettiArray = Array.from({ length: 70 }, () => new ConfettiParticle());

        function animateConfetti() {
            ctx.clearRect(0, 0, width, height);
            confettiArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateConfetti);
        }

        animateConfetti();
    </script>
</body>
</html>
